<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同审查 · Contract AI</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header class="navbar">
    <div class="brand"><span class="logo">⚖️</span> Contract AI</div>
    <nav>
      <a href="/kb" data-page="kb">📚 知识库问答</a>
      <a href="/" data-page="chat">🤖 智能体对话</a>
      <a href="/draft" data-page="draft">📝 AI 起草</a>
      <a href="/review" data-page="review">📋 合同审查</a>
      <a href="/inspect" data-page="inspect">📊 合同巡检</a>
      <a href="/ingest" data-page="ingest">📤 合同入库</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="page-title">📋 合同智能审查</div>
      <div class="page-sub">对选定合同按 8 个风险维度（违约金 / 付款 / 保密 / 解约 / 知识产权 / 争议解决 / 责任限制 / 核心义务）逐项审查，输出风险等级与修改建议。</div>

      <div class="input-row">
        <select id="fileSelect" style="flex:1;">
          <option value="">— 请选择合同 —</option>
        </select>
        <button class="btn btn-primary" id="reviewBtn">开始审查</button>
        <button class="btn" id="stopBtn" style="display:none;">⏹ 停止任务</button>
      </div>
      <div class="dim-sel" id="dimSel" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
        <span style="font-size:12.5px;color:var(--muted);">审查维度：</span>
        <label class="dim-chip"><input type="checkbox" value="违约金与赔偿" checked><span>违约金</span></label>
        <label class="dim-chip"><input type="checkbox" value="付款与结算" checked><span>付款结算</span></label>
        <label class="dim-chip"><input type="checkbox" value="保密义务" checked><span>保密</span></label>
        <label class="dim-chip"><input type="checkbox" value="合同解除与终止" checked><span>解约终止</span></label>
        <label class="dim-chip"><input type="checkbox" value="知识产权" checked><span>知识产权</span></label>
        <label class="dim-chip"><input type="checkbox" value="争议解决" checked><span>争议解决</span></label>
        <label class="dim-chip"><input type="checkbox" value="责任限制与免责" checked><span>责任限制</span></label>
        <label class="dim-chip"><input type="checkbox" value="核心义务与违约责任" checked><span>核心义务</span></label>
        <label class="dim-chip dim-all"><input type="checkbox" id="dimAll" checked><span>全选</span></label>
      </div>
      <div id="modelTag" style="color:var(--muted);font-size:12px;margin-top:8px;"></div>

      <div id="progPanel" style="display:none;margin-top:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span id="progText" style="font-size:13px;color:var(--muted);"></span>
          <span id="progPct" style="font-size:13px;font-weight:700;color:var(--primary);"></span>
        </div>
        <div style="height:10px;border-radius:8px;background:#e2e8f0;overflow:hidden;">
          <div id="progFill" style="height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .4s ease;"></div>
        </div>
        <div id="reviewTarget" style="margin-top:9px;font-size:13.5px;font-weight:600;color:#1e293b;"></div>
      </div>

      <div id="viewTabs" style="display:none;margin-top:18px;gap:8px;align-items:center;">
        <button type="button" class="btn viewtab active" data-v="dims">📊 分维度明细</button>
        <button type="button" class="btn viewtab" data-v="report">🤖 报告解读</button>
        <span id="reportStatus" style="color:var(--muted);font-size:12px;"></span>
      </div>

      <div class="result-box" id="reportBox">
        <div class="empty-tip" id="emptyTip">选择一份合同后点击「开始审查」</div>
      </div>

      <div class="result-box" id="reportView" style="display:none;">
        <div class="empty-tip">审查完成后可切换到「🤖 报告解读」查看智能体总结</div>
      </div>
    </div>
  </main>

<script src="/static/main.js?v=3"></script>
<script>
initPage('review');
const fileSelect = document.getElementById('fileSelect');
const reviewBtn = document.getElementById('reviewBtn');
const stopBtn = document.getElementById('stopBtn');
const reportBox = document.getElementById('reportBox');
const emptyTip = document.getElementById('emptyTip');
const progPanel = document.getElementById('progPanel');
const progText = document.getElementById('progText');
const progPct = document.getElementById('progPct');
const reviewTarget = document.getElementById('reviewTarget');
let reviewingName = '';
const viewTabs = document.getElementById('viewTabs');
const reportView = document.getElementById('reportView');
const reportStatus = document.getElementById('reportStatus');
const SUMMARY_JOB_KEY = 'ct_report_job';   // 报告解读后台任务
const RESULT_KEY = 'ct_review_state';       // 已完成审查结果（切页/刷新恢复用）
const REPORT_KEY = 'ct_report_text';        // 已生成的报告解读全文（避免重复生成）
let summaryStarted = false;   // 报告解读是否已启动
let currentView = 'dims';     // dims / report
let summaryJobId = '';
let sumES = null;             // 报告解读 EventSource
let sumBubble = null;         // 报告解读输出气泡
const progFill = document.getElementById('progFill');

const JOB_KEY = 'contract_review_job';
let es = null;
let running = false;
let paused = false;
let jobId = null;
let timerInt = null;
let startTs = 0;
let totalDims = 8;
let results = [];
let pending = null;    // 当前进行中维度 {index,name,raw}；null=无
let curCardEl = null;  // 当前进行中维度的卡片 DOM（token 级流式更新用）

/* ---------- 文件加载 ---------- */
async function loadFiles() {
  try {
    const j = await apiJSON('/api/files');
    document.getElementById('modelTag').textContent = '模型：' + j.model + ' ｜ 知识库切片：' + (j.stats?.total_chunks ?? 0);
    fileSelect.innerHTML = '<option value="">— 请选择合同 —</option>' +
      j.files.map(f => `<option value="${esc(f.name)}">${esc(f.name)}</option>`).join('');
  } catch (e) {
    document.getElementById('modelTag').textContent = '加载文件列表失败';
  }
}

/* ---------- 进度条 ---------- */
function fmt(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function setProg(pct, label) {
  progPanel.style.display = 'block';
  progFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
  progPct.textContent = Math.round(pct) + '%';
  if (label != null) progText.textContent = label;
}
function doneRatio() { return totalDims ? results.length / totalDims : 0; }
function updateProg() {
  if (!running) return;
  const used = startTs ? fmt((Date.now() - startTs) / 1000) : '0:00';
  if (pending) {
    setProg(doneRatio() * 100, `正在审查 ${pending.index}/${totalDims}：${pending.name} · 已用 ${used}`);
  } else {
    setProg(doneRatio() * 100, `已完成 ${results.length}/${totalDims} 个维度 · 已用 ${used}`);
  }
}
function startTimer() {
  startTs = Date.now();
  stopTimer();
  timerInt = setInterval(updateProg, 1000);
}
function stopTimer() { if (timerInt) { clearInterval(timerInt); timerInt = null; } }

/* ---------- 卡片渲染 ---------- */
function resetReport() {
  results = [];
  pending = null;
  reportBox.innerHTML = '';
  emptyTip.classList.add('hidden');
  resetSummaryUI();
}

/* ===== 明细 / 报告解读 双视图 ===== */
function closeSummaryES() { if (sumES) { sumES.close(); sumES = null; } }
function resetSummaryUI() {
  summaryStarted = false;
  if (summaryJobId) {
    // 中止仍在后台运行的报告任务（重新审查时不再需要）
    try { navigator.sendBeacon && navigator.sendBeacon('/api/jobs/' + summaryJobId + '/abort?token=' + encodeURIComponent(getToken())); } catch (_) { /* noop */ }
  }
  summaryJobId = '';
  closeSummaryES();
  sessionStorage.removeItem(SUMMARY_JOB_KEY);
  viewTabs.style.display = 'none';
  reportView.style.display = 'none';
  reportView.innerHTML = '';
  sumBubble = null;
  currentView = 'dims';
  reportStatus.textContent = '';
}
function showResultTabs(autostart) {
  if (!results.length) return;
  viewTabs.style.display = 'flex';
  switchView(autostart ? 'report' : 'dims');
}
function switchView(v) {
  currentView = v;
  document.querySelectorAll('#viewTabs .viewtab').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  reportBox.style.display = (v === 'dims') ? '' : 'none';
  reportView.style.display = (v === 'report') ? '' : 'none';
  if (v === 'report') maybeStartSummary();
}
function buildSummaryBubble() {
  reportView.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'chat';
  wrap.innerHTML = `<div class="msg ai"><div class="avatar">🤖</div><div class="bubble"></div></div>`;
  reportView.appendChild(wrap);
  const b = wrap.querySelector('.bubble');
  b.classList.add('cursor');
  return b;
}
function summaryScroll() { reportView.scrollTop = reportView.scrollHeight; }
function summaryDone(payload) {
  closeSummaryES(); summaryJobId = ''; sessionStorage.removeItem(SUMMARY_JOB_KEY);
  let text = (typeof payload === 'string' && payload) ? payload : '';
  if (sumBubble) {
    if (!text) text = sumBubble.textContent || '';
    sumBubble.textContent = text || sumBubble.textContent;
    sumBubble.classList.remove('cursor');
  }
  reportStatus.textContent = '✅ 报告解读生成完成';
  try { if (text) sessionStorage.setItem(REPORT_KEY, JSON.stringify({ text })); } catch (_) { /* noop */ }
}
function summaryFail(msg, canRetry) {
  closeSummaryES(); summaryJobId = ''; sessionStorage.removeItem(SUMMARY_JOB_KEY);
  if (sumBubble) { sumBubble.classList.remove('cursor'); sumBubble.textContent += '\n❌ ' + (msg || '生成失败'); }
  reportStatus.textContent = '⚠️ ' + (msg || '生成中断') + '（可切换到「报告解读」重新生成）';
  if (canRetry) summaryStarted = false;
}
function onSummaryEvent(ev) {
  const t = ev.type, d = ev.data || {};
  if (t === 'snapshot') {
    if (d.status === 'done') { summaryDone(d.payload || null); }
    else if (d.status === 'error') { summaryFail(d.error || '生成失败'); }
    else {
      if (d.text && sumBubble && !sumBubble.textContent) sumBubble.textContent = d.text;  // 续接已有进度
      reportStatus.textContent = '🤖 报告解读智能体生成中…';
    }
  } else if (t === 'token') {
    if (sumBubble) { sumBubble.textContent += (d.text || ''); summaryScroll(); }
  } else if (t === 'result') { summaryDone(d); }
  else if (t === 'done') { summaryDone(null); }
  else if (t === 'error') { summaryFail((d.message || d.text || '生成失败')); }
}
function connectSummaryJob(id) {
  closeSummaryES();
  sumES = new EventSource('/api/jobs/' + encodeURIComponent(id) + '/stream?token=' + encodeURIComponent(getToken()));
  sumES.onmessage = (e) => { try { onSummaryEvent(JSON.parse(e.data)); } catch (_) { /* noop */ } };
  sumES.onerror = () => {
    // 任务可能已失效（如服务重启）→ 断开并允许重新生成
    summaryFail('报告任务已失效（服务可能重启）', true);
  };
}
async function maybeStartSummary() {
  if (summaryStarted || !results.length || running) return;
  summaryStarted = true;
  // 报告已生成过并持久化 → 直接展示，不重复调用模型
  try {
    const rr = sessionStorage.getItem(REPORT_KEY);
    if (rr) {
      const rp = JSON.parse(rr);
      if (rp && rp.text) {
        sumBubble = buildSummaryBubble();
        sumBubble.textContent = rp.text;
        sumBubble.classList.remove('cursor');
        reportStatus.textContent = '✅ 报告解读生成完成';
        return;
      }
    }
  } catch (_) { /* ignore */ }
  sumBubble = buildSummaryBubble();
  reportStatus.textContent = '提交报告解读任务…';
  // 若切页前已有进行中的报告任务 → 直接续接，不重复创建
  try {
    const raw = sessionStorage.getItem(SUMMARY_JOB_KEY);
    if (raw) {
      const st = JSON.parse(raw);
      if (st && st.job) { summaryJobId = st.job; reportStatus.textContent = '正在续接报告解读生成…'; connectSummaryJob(st.job); return; }
    }
  } catch (_) { /* ignore */ }
  try {
    const j = await apiJSON('/api/review/summary', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: reviewingName, results }),
    });
    summaryJobId = j.job_id;
    sessionStorage.setItem(SUMMARY_JOB_KEY, JSON.stringify({ job: j.job_id }));
    connectSummaryJob(j.job_id);
  } catch (e) {
    summaryFail((e && e.message) || '提交失败', true);
  }
}
function cardEl() {
  const el = document.createElement('div');
  el.className = 'report-dim';
  reportBox.appendChild(el);
  return el;
}
/* 数据驱动全量重绘：results 结果卡 + pending 当前维度 loading 卡。
   维度状态每次变化都整体重建，杜绝「loading 卡残留 / 不被填充」。 */
function renderAll() {
  reportBox.innerHTML = '';
  emptyTip.classList.add('hidden');
  curCardEl = null;
  results.forEach(d => fillResultCard(cardEl(), d));
  if (pending) {
    const card = cardEl();
    // 进行中的卡片 = 正在生长的结果卡：无「X/8 审查中」占位头，
    // 风险标签 / 依据原文 / 审查意见随生成实时长出（updateLiveCard）
    card.innerHTML = `<div class="head">
        <strong>${esc(pending.name)}</strong>
        <span class="risk-slot"></span>
        <span class="spinner"></span>
      </div>
      <div class="body live-body">
        <div class="lbl">📌 依据原文</div>
        <div class="evidence-text ev-slot" style="color:var(--muted);">分析中…</div>
        <div class="lbl">💡 审查意见</div>
        <div class="op op-slot" style="color:var(--muted);">分析中…</div>
      </div>`;
    curCardEl = card;
  }
  reportBox.scrollTop = reportBox.scrollHeight;
}
function fillResultCard(card, d) {
  const level = d.risk_level || '未知';
  const tag = `<span class="risk-tag risk-${esc(level)}">风险：${esc(level)}</span>`;
  card.innerHTML = `
    <div class="head"><strong>${esc(d.dimension || '')}</strong>${tag}</div>
    <div class="body">
      <div class="lbl">📌 依据原文</div>
      <div class="evidence-text">${esc(d.evidence || '未找到相关条款')}</div>
      <div class="lbl">💡 审查意见</div>
      <div class="op">${esc(d.opinion || '')}</div>
    </div>`;
}
/* ---------- 结构化流式输出 ---------- */
/* 从「当前维度已生成的原始文本」中容错提取已出现的字段（可能未闭合） */
function parsePartial(raw) {
  let t = String(raw || '');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1];
  const un = s => s.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
  const g = (key) => {
    const m = t.match(new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    return m ? un(m[1]) : '';
  };
  const gPartial = (key, full) => {
    if (full) return '';
    const m = t.match(new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)$'));
    return m ? un(m[1]) : '';
  };
  const out = { risk: '', evidence: '', opinion: '' };
  out.risk = g('risk_level');
  out.evidence = g('evidence');
  out.opinion = g('opinion');
  out.evidencePartial = gPartial('evidence', out.evidence);
  out.opinionPartial = gPartial('opinion', out.opinion);
  return out;
}
function riskTagHTML(level) {
  const lv = String(level || '未知');
  return `<span class="risk-tag risk-${esc(lv)}">风险：${esc(lv)}</span>`;
}
/* 把当前维度已生成的部分字段实时渲染到进行中卡片（风险标签 → 依据 → 意见打字机） */
function updateLiveCard() {
  if (!pending || !curCardEl) return;
  const f = parsePartial(pending.raw);
  const q = s => curCardEl.querySelector(s);
  const riskSlot = q('.risk-slot');
  if (riskSlot && f.risk && !riskSlot.innerHTML) {
    riskSlot.innerHTML = riskTagHTML(f.risk);
    const sp = curCardEl.querySelector('.spinner');
    if (sp) sp.remove();  // 风险等级已出，去掉加载动画
  }
  const evTxt = f.evidence || f.evidencePartial;
  const opTxt = f.opinion || f.opinionPartial;
  if (evTxt) { const ev = q('.ev-slot'); if (ev && ev.textContent !== evTxt) ev.textContent = evTxt; }
  if (opTxt) { const op = q('.op-slot'); if (op && op.textContent !== opTxt) op.textContent = opTxt; }
  if (evTxt || opTxt) { const box = reportBox; if (box) box.scrollTop = box.scrollHeight; }
}

function showSummary() {
  const high = results.filter(r => (r.risk_level || '') === '高').length;
  const mid = results.filter(r => (r.risk_level || '') === '中').length;
  const box = document.createElement('div');
  box.style.cssText = 'border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#f8fafc;font-size:14px;';
  box.innerHTML = `<strong>📊 审查汇总：</strong>高风险 <b style="color:var(--red)">${high}</b> 项 ｜ 中风险 <b style="color:var(--orange)">${mid}</b> 项 ｜ 共审查 ${results.length} 个维度`;
  reportBox.appendChild(box);
}

/* ---------- 状态机 ---------- */
function closeES() { if (es) { es.close(); es = null; } }
function refreshBtns() {
  if (running) {
    reviewBtn.disabled = true; reviewBtn.textContent = '任务进行中…';
    stopBtn.style.display = 'inline-block'; stopBtn.textContent = '⏸ 暂停';
  } else if (paused) {
    reviewBtn.disabled = true; reviewBtn.textContent = '已暂停';
    stopBtn.style.display = 'inline-block'; stopBtn.textContent = '▶ 继续审查';
  } else {
    reviewBtn.disabled = false; reviewBtn.textContent = '开始审查';
    stopBtn.style.display = 'none';
  }
}
function setActive() { running = true; paused = false; refreshBtns(); }
function setPausedState() { running = false; paused = true; refreshBtns(); }
function setIdle() { running = false; paused = false; refreshBtns(); }
function onDimStart(d) {
  totalDims = d.total || totalDims;
  if (d.index > 0 && d.name) pending = { index: d.index, name: d.name, raw: '' };
  renderAll();
  updateProg();
}
function onDimDone(d) {
  results.push(d);
  pending = null;   // 本维度已完成，等待下一个 dim_start；避免残留 loading 卡
  renderAll();
  updateProg();
}
function onDone() {
  stopTimer();
  if (results.length > 0) showSummary();
  if (reviewingName) reviewTarget.innerHTML = `✅ 已完成《${esc(reviewingName)}》审查`;
  setProg(100, '✅ 审查完成，共 ' + results.length + ' 个维度');
  setIdle();
  // 持久化完成态：切页/刷新后仍可恢复明细，并让报告解读能续接/复用
  try { if (results.length) sessionStorage.setItem(RESULT_KEY, JSON.stringify({ filename: reviewingName, results })); } catch (_) { /* noop */ }
  clearJobStorage();
  closeES();
  if (results.length) showResultTabs(true);   // 审查结束 → 收起明细、切到报告解读
}
function onError(msg) {
  stopTimer();
  setProg(doneRatio() * 100, '⚠️ ' + (msg || '任务出错'));
  const tip = document.createElement('div');
  tip.style.cssText = 'border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;';
  tip.textContent = '审查任务未完成：' + (msg || '未知错误');
  reportBox.appendChild(tip);
  setIdle();
  clearJobStorage();
  closeES();
}
function onPaused(msg) {
  stopTimer();
  setPausedState();
  setProg(doneRatio() * 100, '⏸ 任务已暂停 · 已完成 ' + results.length + '/' + totalDims + ' 个维度，点「继续审查」接着跑');
  const tip = document.createElement('div');
  tip.style.cssText = 'border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13px;';
  tip.textContent = '任务已暂停：已完成 ' + results.length + '/' + totalDims + ' 个维度。点击「▶ 继续审查」可从断点继续，已完成的结果会保留。';
  reportBox.appendChild(tip);
  closeES();
  // 注意：保留 jobId 与 sessionStorage，便于刷新/切页后仍可继续
}
function handleSnapshot(s) {
  resetReport();
  totalDims = s.total || totalDims;
  results = (s.results || []).slice();
  if (s.status === 'running') {
    setActive();
    if (s.index > 0 && s.dim_name) pending = { index: s.index, name: s.dim_name, raw: s.text || '' };
    renderAll();
    updateLiveCard();   // 恢复进度时先渲染已生成的部分字段
    startTimer();
    updateProg();
  } else if (s.status === 'done') {
    renderAll();
    if (results.length) { showSummary(); setProg(100, '✅ 审查完成（历史任务）'); }
    setIdle(); clearJobStorage(); closeES();
    showResultTabs(false);   // 历史任务：显示双视图，用户可切到报告解读手动生成
  } else if (s.status === 'paused') {
    renderAll();
    onPaused();
  } else {
    onError(s.error || '任务已中止');
  }
}
function handle(ev) {
  const t = ev.type, d = ev.data || {};
  if (t === 'snapshot') handleSnapshot(d);
  else if (t === 'dim_start') onDimStart(d);
  else if (t === 'token') {
    if (pending) pending.raw += (d.text || '');
    updateLiveCard();   // 结构化流式：逐 token 长出风险标签 / 依据 / 意见
  }
  else if (t === 'dim_done') onDimDone(d);
  else if (t === 'done') onDone();
  else if (t === 'paused') onPaused();
  else if (t === 'error') onError(d.message || '未知错误');
}

/* ---------- 提交 / 订阅 ---------- */
function selectedDims() {
  return [...document.querySelectorAll('#dimSel input[type=checkbox]:checked:not(#dimAll)')]
    .map(i => i.value);
}
function syncDimAll() {
  const boxes = [...document.querySelectorAll('#dimSel input[type=checkbox]:not(#dimAll)')];
  const all = document.getElementById('dimAll');
  if (all) all.checked = boxes.every(b => b.checked);
}
function bindDimSel() {
  const all = document.getElementById('dimAll');
  if (all) {
    all.addEventListener('change', () => {
      const on = all.checked;
      document.querySelectorAll('#dimSel input[type=checkbox]:not(#dimAll)')
        .forEach(b => { b.checked = on; });
    });
  }
  document.querySelectorAll('#dimSel input[type=checkbox]:not(#dimAll)').forEach(b =>
    b.addEventListener('change', syncDimAll));
}
async function submitReview() {
  const filename = fileSelect.value;
  if (!filename || running || paused) return;
  const dims = selectedDims();
  if (!dims.length) { alert('请至少勾选一个审查维度'); return; }
  reviewingName = filename;
  // 新审查开始 → 清除上一份合同持久化的完成态
  try { sessionStorage.removeItem(RESULT_KEY); sessionStorage.removeItem(REPORT_KEY); } catch (_) { /* noop */ }
  reviewTarget.innerHTML = `📄 正在审查：《${esc(filename)}》`;
  setActive();
  resetReport();
  progPanel.style.display = 'block';
  setProg(0, '正在提交审查任务…');
  try {
    const j = await apiJSON('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename, dims }),
    });
    totalDims = j.total_dims || dims.length;
    jobId = j.job_id;
    sessionStorage.setItem(JOB_KEY, jobId);
    setProg(0, '任务已提交，正在加载合同知识库…');
    connect(jobId);
  } catch (e) {
    onError('提交失败：' + e.message);
  }
}
function connect(id) {
  closeES();
  es = new EventSource('/api/jobs/' + encodeURIComponent(id) + '/stream?token=' + encodeURIComponent(getToken()));
  es.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (_) { /* noop */ } };
  // onerror 由 EventSource 自动重连；任务结束统一走 done / error 事件
}
function clearJobStorage() {
  jobId = null;
  sessionStorage.removeItem(JOB_KEY);
}

/* ---------- 页面恢复：切页 / 刷新后回来自动续看 ---------- */
function maybeRestore() {
  const id = sessionStorage.getItem(JOB_KEY);
  if (!id) return;
  apiJSON('/api/jobs/' + encodeURIComponent(id) + '/status')
    .then(s => {
      if (!s.exists) { sessionStorage.removeItem(JOB_KEY); return; }
      if (s.status === 'running') {
        jobId = id;
        setActive();
        resetReport();
        progPanel.style.display = 'block';
        connect(id);
      } else if (s.status === 'paused') {
        // 恢复「已暂停」界面：保留 jobId，可点「继续审查」接着跑
        jobId = id;
        setPausedState();
        resetReport();
        totalDims = s.total || totalDims;
        results = (s.results || []).slice();
        renderAll();
        progPanel.style.display = 'block';
        setProg(doneRatio() * 100, '⏸ 任务已暂停 · 已完成 ' + results.length + '/' + totalDims + ' 个维度');
      } else {
        sessionStorage.removeItem(JOB_KEY);
      }
    })
    .catch(() => { /* 服务暂不可用，忽略 */ });
}

/* ---------- 页面恢复：已完成态（审查结果 + 报告解读） ---------- */
function maybeRestoreFinished() {
  let raw = null;
  try { raw = sessionStorage.getItem(RESULT_KEY); } catch (_) { return; }
  if (!raw) return;
  let st = null;
  try { st = JSON.parse(raw); } catch (_) { return; }
  if (!st || !Array.isArray(st.results) || !st.results.length) { sessionStorage.removeItem(RESULT_KEY); return; }
  reviewingName = st.filename || '';
  results = st.results.slice();
  renderAll();
  if (results.length) showSummary();
  progPanel.style.display = 'block';
  setProg(100, '✅ 审查完成，共 ' + results.length + ' 个维度');
  if (reviewingName) reviewTarget.innerHTML = `✅ 已完成《${esc(reviewingName)}》审查`;
  setIdle();
  showResultTabs(false);
  // 报告解读仍在后台生成 → 自动续接；报告已生成 → 直接展示
  let resume = false;
  try { resume = !!sessionStorage.getItem(SUMMARY_JOB_KEY); } catch (_) { /* noop */ }
  let hasReport = false;
  try { hasReport = !!sessionStorage.getItem(REPORT_KEY); } catch (_) { /* noop */ }
  if (resume || hasReport) switchView('report');
}

/* ---------- 离开页面：通知后端（浏览器关闭 / 切页） ---------- */
window.addEventListener('pagehide', () => {
  if (es) { es.close(); es = null; }
  closeSummaryES();   // 关闭订阅但不中止后台报告任务（切页不打断，回来自动续接）
  if (jobId) {
    try { navigator.sendBeacon && navigator.sendBeacon('/api/jobs/' + jobId + '/leave?token=' + encodeURIComponent(getToken())); } catch (_) { /* noop */ }
  }
});

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('#viewTabs .viewtab').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.v));
});
reviewBtn.addEventListener('click', submitReview);
bindDimSel();
stopBtn.addEventListener('click', async () => {
  if (!jobId) return;
  const action = running ? 'pause' : 'resume';
  try {
    await apiFetch('/api/jobs/' + encodeURIComponent(jobId) + '/' + action, { method: 'POST' });
    if (action === 'pause') {
      // 服务端会推送 paused 事件收尾；若连接已断则本地兜底进入暂停态
      setTimeout(() => { if (running) onPaused(); }, 1500);
    } else {
      // 继续：重新订阅进度
      setActive();
      connect(jobId);
    }
  } catch (_) { onError('操作失败'); }
});
loadFiles();
maybeRestore();
maybeRestoreFinished();   // 已完成审查结果 + 报告解读恢复
</script>
