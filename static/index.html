<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体对话 · Contract AI</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header class="navbar">
    <div class="brand"><span class="logo">⚖️</span> Contract AI</div>
    <nav>
      <a href="/kb" data-page="kb">📚 知识库问答</a>
      <a href="/" data-page="chat">🤖 智能体对话</a>
      <a href="/draft" data-page="draft">📝 AI 起草</a>
      <a href="/review" data-page="review">📋 合同审查</a>
      <a href="/inspect" data-page="inspect">📊 合同巡检</a>
      <a href="/ingest" data-page="ingest">📤 合同入库</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="page-title">🤖 智能体对话</div>
      <div class="page-sub">LangGraph 记忆型 Agent：自主判断是否检索知识库 / 审查合同 / 抽取要素，支持多轮上下文记忆。可在下方勾选特定合同，将 Agent 的知识库检索范围限定在其内（默认全部合同）。</div>

      <div class="chat" id="chatBox">
        <div class="msg ai">
          <div class="avatar">🤖</div>
          <div class="bubble">你好，我是企业合同智能助手 👋 你可以问我合同条款内容、让我审查合同风险或抽取合同要素。</div>
        </div>
      </div>

      <div class="ctx-row" style="margin-top:8px;">
        <div id="ctxPicker"></div>
        <span class="ctx-hint">勾选合同后即作为智能体的「当前处理对象」，无需再在提问里说明；不勾选 = 对全部合同操作</span>
      </div>

      <div class="scope-bar"><span class="scope-tag" id="scopeTag">📌 当前处理对象：全部合同（未限定）</span></div>

      <div class="input-row" style="margin-top:16px;">
        <textarea id="chatInput" rows="2" placeholder="例如：保密协议的保密期限是多久？ / 帮我审查采购合同的风险 / 抽取劳动合同的要素"></textarea>
        <button class="btn btn-primary" id="sendBtn">发送</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;align-items:center;">
        <button class="btn btn-ghost" id="newChatBtn">🔄 新对话</button>
        <span id="sessionTag" style="color:var(--muted);font-size:12px;"></span>
      </div>
    </div>
  </main>

<script src="/static/main.js?v=3"></script>
<script>
initPage('chat');

const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const sessionTag = document.getElementById('sessionTag');

// 当前会话（多轮记忆 thread_id），刷新后仍延续
let threadId = sessionStorage.getItem('thread_id') || newThreadId();
sessionStorage.setItem('thread_id', threadId);
sessionTag.textContent = '会话ID: ' + threadId.slice(0, 12) + '…（多轮记忆）';

// 用户选定的上下文合同范围（空数组 = 全部合同）
let ctxSelected = [];

// 「当前处理对象」常驻提示条：选择合同后无需再在提问里说明对象
const scopeTag = document.getElementById('scopeTag');
function refreshScope() {
  if (!scopeTag) return;
  if (!ctxSelected.length) {
    scopeTag.textContent = '📌 当前处理对象：全部合同（未限定）';
  } else {
    const names = ctxSelected.join('、');
    scopeTag.textContent = '📌 当前处理对象：' + ctxSelected.length + ' 份合同 · ' +
      (names.length > 46 ? names.slice(0, 46) + '…' : names);
  }
}
mountCtxPicker({
  container: document.getElementById('ctxPicker'),
  storageKey: 'chat_ctx_sources',
  onChange: s => { ctxSelected = s; refreshScope(); },
});
refreshScope();

// 当前正在生成的 AI 回合
let curAi = null;    // 干净回答气泡（.msg.ai）
let curProc = null;  // 思考/工具过程区（小字）

// 最终回答打字机（后端按消息整段发 token，前端逐字打出保持流式观感）
let typeBuf = '';
let typeTimer = null;
function stopTyping() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  typeBuf = '';
}
function typePush(text) {
  typeBuf += text;
  if (!typeTimer) {
    typeTimer = setInterval(() => {
      if (!typeBuf) { stopTyping(); return; }
      const step = Math.min(8, typeBuf.length);
      const piece = typeBuf.slice(0, step);
      typeBuf = typeBuf.slice(step);
      if (curAi) { answerFull += piece; renderAnswer(); }
    }, 16);
  }
}

function addUserMsg(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `<div class="avatar">👤</div><div class="bubble">${esc(text)}</div>`;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 每轮 AI 回合 = 上方「过程小字区」+ 下方「干净回答气泡」两部分
let answerFull = '';   // 当前回答全文（Markdown 渲染用）
function beginAgentTurn() {
  stopTyping();
  answerFull = '';
  const row = document.createElement('div');
  row.className = 'agent-turn';
  row.innerHTML = `
    <div class="agent-proc hidden">
      <div class="proc-head">⚙️ Agent 思考与工具过程</div>
      <div class="proc-body"></div>
    </div>
    <div class="msg ai">
      <div class="avatar">🤖</div>
      <div class="bubble"></div>
    </div>`;
  chatBox.appendChild(row);
  curAi = row.querySelector('.msg.ai');
  curAi.querySelector('.bubble').classList.add('cursor');
  const box = row.querySelector('.agent-proc');
  const body = row.querySelector('.proc-body');
  // 点标题可折叠/展开过程区
  row.querySelector('.proc-head').addEventListener('click', () => {
    body.classList.toggle('hidden');
  });
  curProc = { box, body };
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 正文（干净回答）：累积全文并以轻量 Markdown 渲染进气泡（**加粗 / - 列表 / # 标题等）
function renderAnswer() {
  if (!curAi) return;
  curAi.querySelector('.bubble').innerHTML = mdRender(answerFull);
  chatBox.scrollTop = chatBox.scrollHeight;
}
function aiAppend(text) {
  if (!curAi) return;
  answerFull += text;
  renderAnswer();
}

// 过程（工具调用/工具结果/模型思考）：小字追加到过程区
function procLine(html) {
  if (!curProc) return;
  curProc.box.classList.remove('hidden');
  const d = document.createElement('div');
  d.className = 'proc-line';
  d.innerHTML = html;
  curProc.body.appendChild(d);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function shortText(s, n) {
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n) + '…' : s;
}

async function send() {
  const message = chatInput.value.trim();
  if (!message || sendBtn.disabled) return;
  addUserMsg(message);
  chatInput.value = '';
  sendBtn.disabled = true;
  beginAgentTurn();

  await streamSSE('/api/chat', { message, thread_id: threadId, sources: ctxSelected }, {
    onEvent(type, payload) {
      if (type === 'tool_call') {
        procLine(`🔧 调用工具：<b>${esc(payload.name)}</b>`);
      } else if (type === 'tool_result') {
        procLine(`📎 工具结果：<span class="pr-txt">${esc(shortText(payload.text, 160))}</span>`);
      } else if (type === 'process') {
        procLine(`💭 ${esc(payload.text || '')}`);
      } else if (type === 'download') {
        // 工具产物（如要素抽取 JSON）：聊天框内提供文件下载按钮
        const dname = payload.filename || 'elements.json';
        const dlabel = payload.label || '合同要素 JSON';
        const ext = (dname.match(/\.[a-z0-9]+$/i) || ['.json'])[0];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dl-json';
        btn.textContent = '📄 下载 ' + dlabel + '（' + ext + '）';
        btn.addEventListener('click', () => {
          const blob = new Blob([payload.content || ''], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = dname;
          document.body.appendChild(a); a.click();
          setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
        });
        const wrap = document.createElement('div');
        wrap.className = 'proc-line';
        wrap.appendChild(btn);
        curProc.body.appendChild(wrap);
        curProc.box.classList.remove('hidden');
        chatBox.scrollTop = chatBox.scrollHeight;
      } else if (type === 'token') {
        typePush(payload.text || '');   // 只把最终干净回答以打字机打进正文气泡
      }
    },
    onDone() { finishSend(); },
    onError(msg) { flushType(); aiAppend('❌ ' + msg); finishNow(); }
  });
}

function flushType() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (typeBuf && curAi) { answerFull += typeBuf; renderAnswer(); }
  typeBuf = '';
}

function finishNow() {
  if (curAi) {
    curAi.querySelector('.bubble').classList.remove('cursor');
  }
  // 本轮没有任何过程内容（纯闲聊）→ 收起过程区
  if (curProc && !curProc.box.querySelector('.proc-line')) {
    curProc.box.classList.add('hidden');
  }
  curProc = null;
  curAi = null;
  sendBtn.disabled = false;
  chatInput.focus();
}

function finishSend() {
  // 正常完成：让打字机把剩余文字打完（保持流式观感）再收尾
  const wait = () => {
    if (typeBuf || typeTimer) setTimeout(wait, 80);
    else finishNow();
  };
  wait();
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
document.getElementById('newChatBtn').addEventListener('click', () => {
  threadId = newThreadId();
  sessionStorage.setItem('thread_id', threadId);
  sessionTag.textContent = '会话ID: ' + threadId.slice(0, 12) + '…（多轮记忆）';
  chatBox.innerHTML = `
    <div class="msg ai"><div class="avatar">🤖</div>
    <div class="bubble">已开启新会话 👋 请开始提问。</div></div>`;
});
</script>
</body>
</html>
